<style>
/* Layout: one-column phone app — sticky header, scrolling view, fixed bottom tab bar. */
:root {
  --bg: #F1F4F1;
  --surface: #FFFFFF;
  --ink: #17201B;
  --muted: #5B6A62;
  --line: #DAE1DC;
  --beet: #9A2252;
  --beet-soft: #F6E2EA;
  --leaf: #2C7650;
  --leaf-soft: #E0F0E6;
  --ice: #2A6896;
  --ice-soft: #E0ECF5;
  --warn: #9C5A06;
  --warn-soft: #FAEDD8;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --radius: 14px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1311; --surface: #17201B; --ink: #E4ECE7; --muted: #95A49B; --line: #29342E;
    --beet: #E5739E; --beet-soft: #3A1D29; --leaf: #6CC795; --leaf-soft: #193127;
    --ice: #7FB6E2; --ice-soft: #172A38; --warn: #E8A858; --warn-soft: #382812;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1311; --surface: #17201B; --ink: #E4ECE7; --muted: #95A49B; --line: #29342E;
  --beet: #E5739E; --beet-soft: #3A1D29; --leaf: #6CC795; --leaf-soft: #193127;
  --ice: #7FB6E2; --ice-soft: #172A38; --warn: #E8A858; --warn-soft: #382812;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
header.top .wrap { padding-block: 12px 10px; display: flex; align-items: center; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; line-height: 1.1; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; margin-top: 3px; }
.back {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; flex: none;
}
main { padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 24px); }
main .wrap { padding-block: 16px; display: grid; gap: 18px; }

h2.sec { font-family: var(--font-display); font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 6px 0 -6px; }
h1.title { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.2; margin: 0; text-wrap: balance; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
a { color: var(--ice); }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--beet); outline-offset: 2px; }

/* Day chips */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.day {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 12px; padding: 8px 0 7px; cursor: pointer; display: grid; gap: 2px; justify-items: center;
}
.day b { font-weight: 600; font-size: 14px; }
.day span { font-size: 9.5px; letter-spacing: -0.03em; color: var(--muted); font-family: var(--font-num); white-space: nowrap; }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day[aria-pressed="true"] span { color: var(--bg); opacity: 0.75; }
.day .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--beet); }
.day .dot.off { background: transparent; }

/* Summary */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; }
.kcal-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.kcal-big { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: -0.02em; }
.kcal-big small { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--leaf-soft); color: var(--leaf); }
.pill.bad { background: var(--beet-soft); color: var(--beet); }
.pill.ice { background: var(--ice-soft); color: var(--ice); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.plain { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.meter { position: relative; height: 10px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.meter .band { position: absolute; top: 0; bottom: 0; z-index: 1; border-left: 2px solid var(--leaf); border-right: 2px solid var(--leaf); background: color-mix(in srgb, var(--leaf) 18%, transparent); }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); border-radius: 6px; }
.meter .tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--beet); z-index: 2; }
.scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.macro { display: grid; gap: 6px; min-width: 0; }
.macro .lab { font-size: 12px; color: var(--muted); }
.macro .val { font-size: 15px; }
.macro .bar { height: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; position: relative; overflow: hidden; }
.macro .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.cost-line { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }

/* Reminders */
.todo { display: grid; gap: 8px; }
.todo div { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.todo svg { flex: none; color: var(--warn); margin-top: 2px; }

/* Meal list */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.meal { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 13px 14px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; color: inherit; }
.list > :first-child { border-top: 0; }
.meal:active { background: var(--bg); }
.meal .when { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
.meal .name { font-weight: 600; font-size: 15px; min-width: 0; }
.meal .k { font-family: var(--font-num); font-size: 15px; text-align: right; align-self: center; grid-row: 1 / 3; grid-column: 2; }
.meal .k small { display: block; font-size: 11px; color: var(--muted); }
.meal .sub { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; grid-column: 1 / -1; font-size: 12px; color: var(--muted); }

/* Recipes */
.rgrid { display: grid; gap: 10px; }
.rcard { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; cursor: pointer; text-align: left; color: inherit; width: 100%; }
.rcard .name { font-weight: 600; }
.rcard .meta { font-size: 12px; color: var(--muted); }
.rcard .k { font-family: var(--font-num); text-align: right; grid-row: 1 / 3; grid-column: 2; align-self: center; }
.rcard .k small { display: block; font-size: 11px; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.nutri { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.nutri div { background: var(--surface); padding: 10px 4px; text-align: center; display: grid; gap: 2px; min-width: 0; }
.nutri b { font-family: var(--font-num); font-weight: 500; font-size: 16px; }
.nutri span { font-size: 11px; color: var(--muted); }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; color: var(--muted); padding: 7px 12px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.ing { width: 100%; border-collapse: collapse; font-size: 14px; }
.ing td { padding: 9px 0; border-top: 1px solid var(--line); vertical-align: top; }
.ing tr:first-child td { border-top: 0; }
.ing td.g { text-align: right; white-space: nowrap; padding-left: 12px; font-family: var(--font-num); }
.ing td.g small { display: block; color: var(--muted); font-size: 11px; }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 12px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
ol.steps li::before { content: counter(s); font-family: var(--font-num); font-size: 13px; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; }
dl.facts { margin: 0; display: grid; gap: 12px; }
dl.facts div { display: grid; gap: 2px; }
dl.facts dt { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
dl.facts dd { margin: 0; }
.note { background: var(--warn-soft); border-radius: 12px; padding: 12px; font-size: 14px; }

/* Cook timeline */
.steps-check { display: grid; }
.chk { display: grid; grid-template-columns: 26px 52px 1fr; gap: 10px; align-items: start; padding: 11px 14px; border-top: 1px solid var(--line); cursor: pointer; }
.list > .chk:first-child { border-top: 0; }
.chk input { width: 22px; height: 22px; margin: 0; accent-color: var(--leaf); }
.chk .t { font-family: var(--font-num); font-size: 12px; color: var(--muted); padding-top: 2px; }
.chk .w { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ice); font-weight: 600; margin-bottom: 2px; }
.chk.done .what { color: var(--muted); text-decoration: line-through; }
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.progress .meter { flex: 1; }
.progress .meter .fill { background: var(--leaf); }
.linkbtn { border: 0; background: none; color: var(--beet); font-weight: 600; cursor: pointer; padding: 4px 0; font-size: 13px; }

/* Shop */
.shop-item { display: grid; grid-template-columns: 26px 1fr auto; gap: 4px 10px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: start; }
.list > .shop-item:first-child, .grp + .shop-item { border-top: 0; }
.shop-item input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--leaf); }
.shop-item .nm { font-weight: 500; min-width: 0; }
.shop-item .pr { font-family: var(--font-num); text-align: right; white-space: nowrap; }
.shop-item .dt { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.shop-item.done .nm, .shop-item.done .pr { color: var(--muted); text-decoration: line-through; }
.grp { padding: 10px 14px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; background: var(--bg); border-top: 1px solid var(--line); }
.list > .grp:first-child { border-top: 0; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 14px; }
.kv .v { font-family: var(--font-num); text-align: right; }
.kv .strong { font-weight: 600; }
ul.tips { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 14px; }
details.more { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 14px; }
details.more summary { cursor: pointer; padding: 13px 0; font-weight: 600; }
details.more[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 12px; }
details.more > :last-child { margin-bottom: 14px; }

/* Tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar); }
nav.tabs a { display: grid; justify-items: center; align-content: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 600; }
nav.tabs a[aria-current="page"] { color: var(--beet); }
nav.tabs svg { width: 22px; height: 22px; }
@media (prefers-reduced-motion: no-preference) {
  .meter .fill, .macro .bar i { transition: width .3s ease; }
}
</style>
</head>

const store = {
  get(k, d) { try { const v = localStorage.getItem("mp1:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("mp1:" + k, JSON.stringify(v)); } catch (e) {} }
};
const JS_DAY = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
let state = { day: JS_DAY[new Date().getDay()], scale: "portion", cook: 0 };

const REMIND = {
  "Вт": ["Вечером переложите минтай (1 кг) и голень (0,9 кг) из морозилки в холодильник — для готовки в среду."],
  "Ср": ["Утром достаньте хлеб из морозилки (на Чт–Вс).", "Вечером готовка на Чт–Вс — откройте вкладку «Готовка»."],
  "Сб": ["Покупки по списку. Голень и остаток бёдер сразу в морозилку.", "Вечером: печень и воскресные порции (плов, минтай, сырники) — из морозилки в холодильник."],
  "Вс": ["Готовка на Пн–Ср — вкладка «Готовка»."]
};
const TIPS = [
  "<b>Минтай</b> — самый дорогой белок (≈4,13 BYN за ужин). Замена на печень или голень удешевит ужины Чт–Вс примерно вдвое.",
  "<b>Бананы → яблоки:</b> 5 BYN/кг против 1,3, съедобной части у банана 64 %. Экономия ≈1,5 BYN в неделю.",
  "<b>Бёдра → голень:</b> 10,28 BYN/кг против 12,91, и жира меньше.",
  "<b>Крупы и макароны</b> выгодно брать большими пачками: «Лидские» 3 кг — 2,04 BYN/кг.",
  "<b>Овощные смеси не выгодны:</b> 10–16 BYN/кг против 1,2–2,4 у капусты, моркови и лука.",
  "<b>Со второй недели</b> корзина дешевле на 8–10 BYN: масло, сахар и мука покупаются раз в несколько недель."
];

function storageFor(rk, day) {
  const r = D.recipes[rk];
  if (r.cookDay === "воскресенье" || r.cookDay === "среда") {
    const idx = r.days.indexOf(day) + 1;
    const batch = r.cookDay === "воскресенье" ? "партия Вс" : "партия Ср";
    if (day === "Вс" && r.cookDay === "среда")
      return `<span class="pill ice">−18 °C морозилка</span><span>${batch}, достать в Сб вечером</span>`;
    return `<span class="pill ok">+2…+4 °C</span><span>${batch}, день ${idx} из ${r.days.length}</span>`;
  }
  if (rk === "S1b") return `<span class="pill plain">без готовки</span><span>яйца сварены в среду</span>`;
  return `<span class="pill plain">без готовки</span>`;
}

/* ---------- header ---------- */
function header(title, sub, back) {
  $("#hdr").innerHTML =
    (back ? `<button class="back" aria-label="Назад" onclick="history.length > 1 ? history.back() : (location.hash='#recipes')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>` : "") +
    `<div class="brand">${esc(title)}<small>${esc(sub)}</small></div>`;
}

/* ---------- Day ---------- */
function viewDay() {
  const T = D.target, d = state.day, dd = D.days[d];
  header("Неделя в контейнерах", `${D.dayFull[d]} · цель ${n0(T.kcal)} ккал, белок от ${D.proteinMin} г`);
  const lo = T.kcal * (1 - D.kcalTol), hi = T.kcal * (1 + D.kcalTol), max = T.kcal * 1.15;
  const dev = (dd.kcal - T.kcal) / T.kcal;
  const okK = Math.abs(dev) <= D.kcalTol, okP = dd.p >= D.proteinMin;
  const pctW = v => Math.max(0, Math.min(100, v / max * 100));
  const macro = (lab, v, t, col) => {
    const w = Math.min(100, v / (t * 1.25) * 100), tk = 100 / 1.25;
    return `<div class="macro"><div class="lab">${lab}</div><div class="val num">${n0(v)}<span class="muted"> / ${t} г</span></div>
      <div class="bar"><i style="width:${w}%;background:${col}"></i><span style="position:absolute;left:${tk}%;top:0;bottom:0;width:2px;background:var(--ink)"></span></div></div>`;
  };
  const chips = D.dayOrder.map(x => {
    const has = !!REMIND[x];
    return `<button class="day" aria-pressed="${x === d}" data-day="${x}"><b>${x}</b><span>${n0(D.days[x].kcal)}</span><i class="dot ${has ? "" : "off"}"></i></button>`;
  }).join("");
  const meals = dd.meals.map(rk => {
    const r = D.recipes[rk];
    return `<button class="meal" data-recipe="${rk}">
      <span class="when">${esc(r.meal)}</span>
      <span class="name">${esc(r.short)}</span>
      <span class="k">${n0(r.kcal)}<small>ккал</small></span>
      <span class="sub"><span class="num">Б ${n0(r.p)} · Ж ${n0(r.f)} · У ${n0(r.c)}</span>${storageFor(rk, d)}</span>
    </button>`;
  }).join("");
  const rem = (REMIND[d] || []).map(t => `<div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>${esc(t)}</span></div>`).join("");
  $("#view").innerHTML = `
    <div class="days" role="group" aria-label="День недели">${chips}</div>
    <section class="panel" aria-label="Итог дня">
      <div class="kcal-row">
        <div class="kcal-big num">${n0(dd.kcal)}<small>ккал</small></div>
        <span class="pill ${okK && okP ? "ok" : "bad"}">${pct(dev)} · ${okK && okP ? "в допуске" : "вне допуска"}</span>
      </div>
      <div>
        <div class="meter" aria-hidden="true">
          <span class="band" style="left:${pctW(lo)}%;width:${pctW(hi) - pctW(lo)}%"></span>
          <span class="fill" style="width:${pctW(dd.kcal)}%;opacity:.85"></span>
          <span class="tick" style="left:${pctW(T.kcal)}%"></span>
        </div>
        <div class="scale num"><span>0</span><span>допуск ${n0(lo)}–${n0(hi)}</span><span>${n0(max)}</span></div>
      </div>
      <div class="macros">
        ${macro("Белки", dd.p, T.p, "var(--beet)")}
        ${macro("Жиры", dd.f, T.f, "var(--warn)")}
        ${macro("Углеводы", dd.c, T.c, "var(--ice)")}
      </div>
      <div class="cost-line"><span>Стоимость съеденного за день</span><span class="num">${byn(dd.cost)} BYN</span></div>
    </section>
    ${rem ? `<h2 class="sec">Сегодня не забыть</h2><div class="todo">${rem}</div>` : ""}
    <h2 class="sec">Приёмы пищи</h2>
    <div class="list">${meals}</div>
    <p class="muted" style="font-size:13px;margin:0">В среднем за неделю: <span class="num">${n0(D.avg.kcal)}</span> ккал · Б ${D.avg.p} · Ж ${D.avg.f} · У ${D.avg.c} г, ≈${byn(D.avg.cost)} BYN в день.</p>`;
  $("#view").querySelectorAll("[data-day]").forEach(b => b.onclick = () => { state.day = b.dataset.day; viewDay(); });
  $("#view").querySelectorAll("[data-recipe]").forEach(b => b.onclick = () => { location.hash = "#recipe-" + b.dataset.recipe.toLowerCase(); });
}

/* ---------- Recipes ---------- */
function viewRecipes() {
  header("Блюда недели", "2 завтрака, 2 обеда, 2 ужина и 3 перекуса");
  const groups = [["Завтраки", ["Завтрак"]], ["Обеды", ["Обед"]], ["Ужины", ["Ужин"]], ["Перекусы", ["Перекус 1", "Перекус 2"]]];
  let html = "";
  for (const [title, meals] of groups) {
    const cards = Object.values(D.recipes).filter(r => meals.includes(r.meal)).map(r => `
      <button class="rcard" data-recipe="${r.id}">
        <span class="name">${esc(r.name)}</span>
        <span class="k">${n0(r.kcal)}<small>ккал</small></span>
        <span class="meta">${dayRange(r.days)} · ${r.cookDay === "без готовки" ? "без готовки" : "готовка: " + esc(r.cookDay)} · <span class="num">${byn(r.cost)}</span> BYN</span>
      </button>`).join("");
    html += `<h2 class="sec">${title}</h2><div class="rgrid">${cards}</div>`;
  }
  $("#view").innerHTML = html;
  $("#view").querySelectorAll("[data-recipe]").forEach(b => b.onclick = () => { location.hash = "#recipe-" + b.dataset.recipe.toLowerCase(); });
}
function dayRange(ds) {
  if (!ds.length) return "—";
  const idx = ds.map(x => D.dayOrder.indexOf(x));
  const cont = idx.every((v, i) => i === 0 || v === idx[i - 1] + 1);
  return cont && ds.length > 1 ? `${ds[0]}–${ds[ds.length - 1]}` : ds.join(", ");
}
function viewRecipe(id) {
  const r = D.recipes[id];
  if (!r) { location.hash = "#recipes"; return; }
  header(r.short, `${r.meal} · ${dayRange(r.days)}`, true);
  const mult = state.scale === "batch" ? r.portions : 1;
  const ings = r.ingredients.map(i => {
    let g;
    if (!i.g) g = `<span class="muted">по вкусу</span>`;
    else {
      const total = i.g * mult;
      g = `${n0(total)} г` + (i.pieces ? `<small>${n1(i.pieces * mult)} шт.</small>` : (i.net !== i.g ? `<small>съедобно ${n0(i.net * mult)} г</small>` : ""));
    }
    return `<tr><td>${esc(i.name)}</td><td class="g">${g}</td></tr>`;
  }).join("");
  const steps = r.steps.map(s => `<li><span>${esc(s)}</span></li>`).join("");
  $("#view").innerHTML = `
    <h1 class="title">${esc(r.name)}</h1>
    <div class="chips">
      <span class="pill plain">${esc(r.meal)}</span>
      <span class="pill plain">${dayRange(r.days)}</span>
      <span class="pill plain">${r.portions} порц.</span>
      ${r.cookDay !== "без готовки" ? `<span class="pill warn">готовка: ${esc(r.cookDay)}</span>` : `<span class="pill plain">без готовки</span>`}
    </div>
    <div class="nutri" aria-label="На 1 порцию">
      <div><b>${n0(r.kcal)}</b><span>ккал</span></div>
      <div><b>${n0(r.p)}</b><span>белки</span></div>
      <div><b>${n0(r.f)}</b><span>жиры</span></div>
      <div><b>${n0(r.c)}</b><span>углев.</span></div>
      <div><b>${byn(r.cost)}</b><span>BYN</span></div>
    </div>
    <section class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <strong>Ингредиенты</strong>
        <div class="seg" role="group" aria-label="Количество">
          <button data-scale="portion" aria-pressed="${state.scale === "portion"}">1 порция</button>
          <button data-scale="batch" aria-pressed="${state.scale === "batch"}">Партия × ${r.portions}</button>
        </div>
      </div>
      <table class="ing"><tbody>${ings}</tbody></table>
      <p class="muted" style="margin:0;font-size:12px">Вес как купили, в сыром виде; крупы и макароны — сухие.</p>
    </section>
    <section class="panel">
      <strong>Как готовить</strong>
      <ol class="steps">${steps}</ol>
    </section>
    ${r.note ? `<div class="note"><b>Важно.</b> ${esc(r.note)}</div>` : ""}
    <section class="panel">
      <dl class="facts">
        <div><dt>Готовая порция</dt><dd>${esc(r.cooked)}</dd></div>
        <div><dt>Раскладка</dt><dd>${esc(r.container)}</dd></div>
        <div><dt>Хранение</dt><dd>${esc(r.storage)}</dd></div>
        <div><dt>Заморозка</dt><dd>${esc(r.freeze)}</dd></div>
        <div><dt>Разогрев</dt><dd>${esc(r.reheat)}</dd></div>
      </dl>
    </section>`;
  $("#view").querySelectorAll("[data-scale]").forEach(b => b.onclick = () => { state.scale = b.dataset.scale; store.set("scale", state.scale); viewRecipe(id); });
}

/* ---------- Cook ---------- */
function viewCook() {
  header("Готовка", "Духовка, аэрогриль и плита работают параллельно");
  const plan = D.cookPlan[state.cook];
  const key = "cook" + state.cook;
  const done = store.get(key, []);
  const cnt = plan.steps.filter((_, i) => done.includes(i)).length;
  const rows = plan.steps.map((s, i) => `
    <label class="chk ${done.includes(i) ? "done" : ""}">
      <input type="checkbox" id="c${state.cook}-${i}" data-i="${i}" ${done.includes(i) ? "checked" : ""}>
      <span class="t">${esc(s.t)}</span>
      <span class="what"><span class="w">${esc(s.where)}</span>${esc(s.what)}</span>
    </label>`).join("");
  const thaw = D.thaw.map(t => `<div class="kv" style="grid-template-columns:1fr"><div><b>${esc(t.when)}</b><div class="muted" style="font-size:14px">${esc(t.what)}</div></div></div>`).join('<hr style="border:0;border-top:1px solid var(--line);margin:0">');
  const cont = D.containers.map(c => `<div>${esc(c.name)}<div class="muted" style="font-size:12px">${esc(c.why)}</div></div><div class="v">${c.count} шт.</div>`).join("");
  $("#view").innerHTML = `
    <div class="seg" role="group" aria-label="День готовки" style="justify-self:start">
      ${D.cookPlan.map((p, i) => `<button data-cook="${i}" aria-pressed="${i === state.cook}">${i === 0 ? "Воскресенье · на Пн–Ср" : "Среда · на Чт–Вс"}</button>`).join("")}
    </div>
    <div>
      <h1 class="title" style="font-size:18px">${esc(plan.title)}</h1>
    </div>
    <div class="progress"><span class="num">${cnt}/${plan.steps.length}</span>
      <div class="meter"><span class="fill" style="width:${cnt / plan.steps.length * 100}%"></span></div>
      <button class="linkbtn" id="resetCook">Сбросить</button></div>
    <div class="list steps-check">${rows}</div>
    <div class="note">Остужайте не дольше 2 часов, разложив неглубоким слоем, потом сразу в холодильник (+2…+4 °C) или морозилку (−18 °C). Подпишите контейнеры: блюдо и дата.</div>
    <h2 class="sec">Что когда доставать из морозилки</h2>
    <section class="panel">${thaw}</section>
    <h2 class="sec">Контейнеры</h2>
    <section class="panel"><div class="kv">${cont}</div></section>`;
  $("#view").querySelectorAll("[data-cook]").forEach(b => b.onclick = () => { state.cook = +b.dataset.cook; store.set("cookTab", state.cook); viewCook(); });
  $("#view").querySelectorAll("input[data-i]").forEach(cb => cb.onchange = () => {
    const i = +cb.dataset.i; let d = store.get(key, []);
    d = cb.checked ? [...new Set([...d, i])] : d.filter(x => x !== i);
    store.set(key, d); viewCook();
  });
  $("#resetCook").onclick = () => { store.set(key, []); viewCook(); };
}

/* ---------- Shop ---------- */
function viewShop() {
  const T = D.totals;
  header("Покупки", `Цены Евроопт / edostavka.by на ${D.pricesDate}`);
  const done = store.get("shop", []);
  const got = D.shop.filter(s => done.includes(s.id));
  const gotSum = got.reduce((a, s) => a + s.pay, 0);
  let rows = "";
  for (const g of D.groups) {
    const items = D.shop.filter(s => s.group === g);
    if (!items.length) continue;
    rows += `<div class="grp">${esc(g)}</div>` + items.map(s => `
      <label class="shop-item ${done.includes(s.id) ? "done" : ""}">
        <input type="checkbox" id="s-${s.id}" data-id="${s.id}" ${done.includes(s.id) ? "checked" : ""}>
        <span class="nm">${esc(s.name)}</span>
        <span class="pr">${byn(s.pay)}</span>
        <span class="dt">
          <span><b style="color:var(--ink);font-weight:600">${esc(s.qty)}</b></span>
          ${s.fixed ? "" : `<span>нужно ${n0(s.need)} г</span>`}
          ${s.perKg ? `<span class="num">${byn(s.perKg)} BYN/кг</span>` : ""}
          ${s.priceOk ? "" : `<span class="pill warn" style="padding:1px 8px">оценка</span>`}
          ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">в магазин ↗</a>` : ""}
        </span>
      </label>`).join("");
  }
  const lim = T.budget_week, pctPay = Math.min(100, T.pay / lim * 100);
  $("#view").innerHTML = `
    <section class="panel" aria-label="Бюджет">
      <div class="kcal-row">
        <div class="kcal-big num">${byn(T.pay)}<small>BYN</small></div>
        <span class="pill ${T.pay <= lim ? "ok" : "bad"}">${T.pay <= lim ? "в бюджете" : "сверх бюджета"} · лимит ${byn(lim)}</span>
      </div>
      <div class="meter" aria-hidden="true"><span class="fill" style="width:${pctPay}%;background:var(--leaf)"></span></div>
      <div class="kv">
        <div>Съедается за неделю</div><div class="v">${byn(T.used)}</div>
        <div>Месяц: неделя × ${String(D.weeks).replace(".", ",")}</div><div class="v">${byn(T.month_pay)}</div>
        <div>Месяц по съеденному</div><div class="v">${byn(T.month_used)}</div>
        <div class="strong">Бюджет месяца (${n0(D.budgetRub)} RUB)</div><div class="v strong">${byn(T.budget_month)}</div>
      </div>
      <div class="cost-line"><span>Курс НБРБ на ${esc(D.rateDate)}</span><span class="num">${String(D.rate).replace(".", ",")} BYN / 100 RUB</span></div>
    </section>
    <div class="progress"><span class="num">${got.length}/${D.shop.length}</span>
      <div class="meter"><span class="fill" style="width:${got.length / D.shop.length * 100}%"></span></div>
      <span class="num">${byn(gotSum)}</span>
      <button class="linkbtn" id="resetShop">Сбросить</button></div>
    <div class="list">${rows}</div>
    <details class="more"><summary>Где сэкономить ещё</summary><ul class="tips">${TIPS.map(t => `<li>${t}</li>`).join("")}</ul></details>
    <p class="muted" style="font-size:12px;margin:0">Цены Green, Диониса и Соседей не проверены. Отметки «куплено» хранятся только в этом браузере.</p>`;
  $("#view").querySelectorAll("input[data-id]").forEach(cb => cb.onchange = () => {
    let d = store.get("shop", []);
    d = cb.checked ? [...new Set([...d, cb.dataset.id])] : d.filter(x => x !== cb.dataset.id);
    store.set("shop", d); viewShop();
  });
  $("#resetShop").onclick = () => { store.set("shop", []); viewShop(); };
}

/* ---------- router ---------- */
function route() {
  const h = (location.hash || "#day").slice(1);
  let tab = h;
  if (h.startsWith("recipe-")) { tab = "recipes"; viewRecipe(h.slice(7).toUpperCase().replace("S1B", "S1b")); }
  else if (h === "recipes") viewRecipes();
  else if (h === "cook") viewCook();
  else if (h === "shop") viewShop();
  else { tab = "day"; viewDay(); }
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0, 0);
}
state.scale = store.get("scale", "portion");
state.cook = store.get("cookTab", ["Пн", "Вт", "Ср"].includes(state.day) ? 1 : 0);
window.addEventListener("hashchange", route);
route();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
